<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>PLCMonitor</title>
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      html, body { height: 100%; overflow: hidden; }
      body {
        font-family: "Inter", "Segoe UI", "Microsoft YaHei", "PingFang SC", sans-serif;
        background: #f4f5f7;
        color: #101828;
        -webkit-font-smoothing: antialiased;
        text-rendering: optimizeLegibility;
      }
      #root { height: 100%; }

      button { font-family: inherit; transition: background-color 0.15s ease, border-color 0.15s ease, color 0.15s ease, opacity 0.15s ease; }
      button:hover { opacity: 0.88; }
      button:disabled { opacity: 0.55; cursor: default; }
      button:focus-visible { outline: 2px solid rgba(37, 99, 235, 0.4); outline-offset: 1px; }

      input, select { font-family: inherit; transition: border-color 0.15s ease, box-shadow 0.15s ease; }
      input:focus, select:focus {
        outline: none;
        border-color: #84adff !important;
        box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.12);
      }

      .num { font-variant-numeric: tabular-nums; font-feature-settings: "tnum"; }

      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #d8dde5; border-radius: 4px; }
      ::-webkit-scrollbar-thumb:hover { background: #c3c9d3; }

      @keyframes toast-in {
        from { opacity: 0; transform: translateY(-4px); }
        to { opacity: 1; transform: translateY(0); }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
